<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }} — 🤪 MADD</title>
<meta name="description" content="{{ .Description }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:type" content="website"><meta property="og:title" content="{{ .Title }} — MADD">
<meta property="og:description" content="{{ .Description }}"><meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ "images/og-default.png" | absURL }}"><meta property="og:image:secure_url" content="{{ "images/og-default.png" | absURL }}">
<meta property="og:image:type" content="image/png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="MADD — Make intent verifiable">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="{{ "images/og-default.png" | absURL }}"><meta name="twitter:image:alt" content="MADD — Make intent verifiable">
<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">
<link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
{{ range .AllTranslations }}<link rel="alternate" hreflang="{{ .Lang }}" href="{{ .Permalink }}">{{ end }}
{{ range where .AllTranslations "Lang" "en" }}<link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">{{ end }}
{{ with .OutputFormats.Get "MD" }}<link rel="alternate" type="text/markdown" href="{{ .Permalink }}">{{ end }}
<link rel="alternate" type="application/json" href="{{ "manifest.json" | absURL }}">
{{ partial "structured-data.html" . }}
