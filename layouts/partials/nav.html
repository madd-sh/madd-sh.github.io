<header class="topbar">
<a class="wordmark" href="{{ .Site.Home.RelPermalink }}"><span class="brand-emoji" aria-hidden="true">🤪</span>MADD<span class="wordmark-dot">.</span></a>
<span class="topbar-label">MULTI-AGENT<br>DRIVEN DEVELOPMENT</span>
<div class="topbar-actions">
<button class="command-trigger" type="button" data-open-commands hidden>{{ i18n "search" }} <kbd>Ctrl K</kbd></button>
<button id="theme-toggle" type="button" hidden><span class="theme-light">{{ i18n "light" }}</span><span class="theme-dark">{{ i18n "dark" }}</span></button>
{{ range .Translations }}<a class="language-link" href="{{ .RelPermalink }}" lang="{{ .Lang }}" hreflang="{{ .Lang }}">{{ .Language.LanguageName }}</a>{{ end }}
</div></header>
