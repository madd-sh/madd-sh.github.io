# MADD - Multi-Agent Driven Development
# Hugo Configuration

baseURL = "https://madd.sh/"
languageCode = "en"
title = "MADD — Multi-Agent Driven Development"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# Use ugly URLs for clean .html file names (concepts.html instead of concepts/index.html)
uglyURLs = true

# Disable default taxonomy pages
disableKinds = ["taxonomy", "term"]

# Enable Git info for lastmod
enableGitInfo = true

# Media types
[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

# Output formats
[outputFormats]
  [outputFormats.HTML]
    mediaType = "text/html"
    isPlainText = false
    isHTML = true
    permalinkable = true

  [outputFormats.MD]
    mediaType = "text/markdown"
    isPlainText = true
    isHTML = false
    permalinkable = true
    notAlternative = true

  [outputFormats.Manifest]
    mediaType = "application/json"
    baseName = "manifest"
    isPlainText = true
    notAlternative = true
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

# Configure outputs for different sections
[outputs]
  home = ["HTML", "MD", "RSS", "Manifest", "LLMS"]
  page = ["HTML", "MD"]
  section = ["HTML", "RSS"]

# Multilingual configuration
[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    contentDir = "content/en"
    [languages.en.params]
      description = "Open-source methodology for AI-assisted development. Control drift and drive convergence between intention and implementation."
      ogTitle = "MADD — Open-Source Multi-Agent Driven Development Framework"

  [languages.fr]
    languageName = "Français"
    weight = 2
    contentDir = "content/fr"
    [languages.fr.params]
      description = "Méthodologie open source pour le développement assisté par IA. Contrôlez la dérive entre intention et implémentation."
      ogTitle = "MADD — Framework Open Source de Développement Multi-Agents"

# Site parameters
[params]
  author = "MADD Community"
  githubUrl = "https://github.com/madd-sh"
  sourceRevision = "feat/madd-relaunch-site"

# Permalinks removed - using uglyURLs = true instead

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.highlight]
    codeFences = false

[security.funcs]
  getenv = ["^HUGO_", "^CI$"]
